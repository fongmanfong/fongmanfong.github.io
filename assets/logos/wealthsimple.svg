<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#0D2818"/>
  <!-- Pixel W: two outer posts and two inner peaks -->
  <!-- Left post -->
  <rect x="2"  y="5"  width="4" height="16" fill="#9FE870"/>
  <!-- Center-left inner peak -->
  <rect x="8"  y="13" width="4" height="8"  fill="#9FE870"/>
  <!-- Bottom join left -->
  <rect x="2"  y="19" width="10" height="2" fill="#9FE870"/>
  <!-- Center-right inner peak -->
  <rect x="20" y="13" width="4" height="8"  fill="#9FE870"/>
  <!-- Bottom join right -->
  <rect x="20" y="19" width="10" height="2" fill="#9FE870"/>
  <!-- Right post -->
  <rect x="26" y="5"  width="4" height="16" fill="#9FE870"/>
  <!-- Center top bridge -->
  <rect x="13" y="5"  width="6" height="4"  fill="#9FE870"/>
  <!-- Center down -->
  <rect x="14" y="9"  width="4" height="12" fill="#9FE870"/>
</svg>
